<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Java OOP as one system: UCMS visualizer with edge cases</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F5F0; --surface:#FFFFFF; --surface2:#ECEEE7; --ink:#18231F; --muted:#586761; --line:#D3D8CE;
  --accent:#0B7A6B; --accent-soft:#D7EFEA; --amber:#9A5E08; --amber-soft:#F6E7C9; --bad:#B3261E; --bad-soft:#F7DAD7; --good:#1D7A3A; --good-soft:#D9EFDF;
  --code-bg:#111C18; --code-ink:#DCE7E0; --code-line:#22322B;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#151E1A; --surface2:#1C2822; --ink:#E4ECE7; --muted:#93A39B; --line:#2A3832;
    --accent:#4FD1BC; --accent-soft:#17352F; --amber:#F2B84B; --amber-soft:#3A2F14; --bad:#FF8A80; --bad-soft:#3F1F1D; --good:#7BD88F; --good-soft:#15341F;
    --code-bg:#0A110E; --code-line:#1D2B25;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#151E1A; --surface2:#1C2822; --ink:#E4ECE7; --muted:#93A39B; --line:#2A3832;
  --accent:#4FD1BC; --accent-soft:#17352F; --amber:#F2B84B; --amber-soft:#3A2F14; --bad:#FF8A80; --bad-soft:#3F1F1D; --good:#7BD88F; --good-soft:#15341F;
  --code-bg:#0A110E; --code-line:#1D2B25;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);scroll-behavior:smooth;height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);min-height:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar b{font:600 18px var(--serif);letter-spacing:.1px}
.bar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.ghost{background:transparent}
#menuBtn{display:none}

.shell{display:grid;grid-template-columns:270px minmax(0,1fr);max-width:1280px;margin:0 auto}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);align-self:start;max-height:calc(100vh - 64px);overflow:auto;padding:18px 12px 40px 20px;font-size:14px}
nav h3{font:600 15px var(--serif);margin:16px 0 4px;color:var(--ink)}
nav a{display:block;padding:3px 8px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none}
nav a:hover{color:var(--ink)}
nav a.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft)}
main{padding:28px 24px 80px;min-width:0}

h1{font:600 clamp(30px,4.6vw,46px)/1.1 var(--serif);margin:0 0 10px;letter-spacing:-.4px}
h2{font:600 clamp(24px,3vw,31px)/1.2 var(--serif);margin:0 0 6px}
h3.t{font:600 22px/1.25 var(--serif);margin:0}
.lead{font-size:18px;max-width:68ch;color:var(--muted);margin:0 0 20px}

.unit-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px;border-bottom:2px solid var(--ink);padding-bottom:8px;margin-bottom:20px}

/* connection map: the memorable element */
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin:22px 0 8px;position:relative}
.map a{position:relative;display:block;text-decoration:none;color:var(--ink);padding:14px 14px 14px 16px;background:var(--surface);border:1px solid var(--line);border-left-width:4px;margin-left:-1px}
.map a:first-child{margin-left:0;border-radius:10px 0 0 10px}
.map a:last-child{border-radius:0 10px 10px 0}
.map a:hover{background:var(--accent-soft)}
.map b{display:block;font:600 16px var(--serif)}
.map small{display:block;color:var(--muted);font-size:13px;line-height:1.4;margin-top:4px}
.map code{font:12px var(--mono);color:var(--accent)}
.map a:nth-child(1){border-left-color:#0B7A6B}.map a:nth-child(2){border-left-color:#2E6FBF}.map a:nth-child(3){border-left-color:#A8660B}.map a:nth-child(4){border-left-color:#8A4FB5}.map a:nth-child(5){border-left-color:#B33A5E}

table{border-collapse:collapse;width:100%;font-size:14.5px;background:var(--surface)}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--surface2);font-weight:600}
.tw{overflow-x:auto;max-width:100%;margin:12px 0}

.topic{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin:0 0 26px}
.topic header{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.syll{font-size:13px;color:var(--muted)}
.wwh{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:8px 0 14px}
.wwh div{background:var(--surface2);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.5}

@media (max-width:820px){.wwh{grid-template-columns:1fr}}

.ucms b{font-family:var(--serif)}
.note{font-size:14.5px;margin:12px 0}
.note ul{margin:6px 0 6px 20px;padding:0}
.note li{margin:3px 0}

.code{border-radius:10px;overflow:hidden;background:var(--code-bg);margin:12px 0;border:1px solid var(--code-line)}
.code-h{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:#1A2A23;color:#9DB3A8;font:12.5px var(--mono)}

.k{color:#F2B84B}.s{color:#8FD6A6}.c{color:#7F9489;font-style:italic}.n{color:#7CC4F0}.t{color:#6FD3C3}.a{color:#E58FB0}

/* visualizers */
.viz{border:1px dashed var(--accent);border-radius:12px;padding:14px 16px;margin:16px 0 4px;background:var(--bg)}
.viz-t{font:600 17px var(--serif);margin:0 0 8px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}

.ctl select,.ctl input[type=text],.ctl input:not([type]){border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px}
.ctl button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:14px}
.ctl button:hover{border-color:var(--accent)}

.msg{margin:8px 0 0;padding:8px 12px;border-radius:8px;background:var(--surface2);font-size:14.5px;min-height:38px}

.msg.err{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--amber-soft);color:var(--amber)}
.mem{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}

.memcol{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:120px}
.memcol h4{margin:0 0 6px;font:600 14px var(--serif)}
.pill{display:inline-block;font:12.5px var(--mono);background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:2px 7px;margin:2px 4px 2px 0}
.obj{border:1px solid var(--accent);border-radius:8px;padding:6px 9px;margin:6px 0;font:12.5px/1.5 var(--mono);background:var(--accent-soft)}
.lines{background:var(--code-bg);border-radius:8px;padding:8px 0;margin:6px 0;font:13px/1.6 var(--mono);color:var(--code-ink);overflow-x:auto}
.lines div{padding:0 12px;white-space:pre;border-left:3px solid transparent}
.lines div.vis{background:#1d3a31;border-left-color:#4FD1BC}
.lines div.cur{background:#4a3a12;border-left-color:#F2B84B}
.con{background:#06100c;color:#B8F0C5;font:13px/1.5 var(--mono);border-radius:8px;padding:8px 12px;min-height:56px;white-space:pre-wrap}
.thr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:8px 0}
.thr div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px}
.thr b{font-family:var(--serif)}
.log{list-style:none;margin:8px 0;padding:0;font-size:14px}
.log li{padding:4px 10px;border-left:3px solid var(--line);margin:2px 0;background:var(--surface)}
.log li.t1{border-left-color:#2E6FBF}.log li.t2{border-left-color:#B33A5E}
.arena{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px;min-height:170px;overflow:auto}
.fx{gap:8px}
.fxc{background:var(--accent-soft);border:1px solid var(--accent);border-radius:6px;padding:6px 10px;font-size:13px;text-align:center;color:var(--ink)}
.hbox{display:flex;flex-direction:row}.vbox{display:flex;flex-direction:column;align-items:flex-start}
.flow{display:flex;flex-wrap:wrap;width:52%;border:1px dashed var(--muted);padding:6px;gap:6px}
.stack{display:grid;width:180px;height:110px}.stack .fxc{grid-area:1/1;align-self:start;justify-self:start}
.border{display:grid;grid-template-areas:"top top top" "left center right" "bottom bottom bottom";grid-template-columns:90px 1fr 90px;grid-template-rows:auto 100px auto;gap:6px}
.gridp{display:grid;grid-template-columns:repeat(3,auto);gap:8px;justify-content:start}
.ev{border:2px dashed var(--accent);border-radius:10px;padding:16px;background:var(--surface);outline:none;cursor:crosshair}
.ev:focus{border-style:solid}
.evlog{height:150px;overflow:auto;background:var(--code-bg);color:#B8F0C5;font:12.5px/1.5 var(--mono);padding:8px 10px;border-radius:8px;white-space:pre-wrap}


.edges{margin:18px 0 4px;border:1px solid var(--amber);border-radius:10px;background:var(--amber-soft);overflow:hidden}
.edges summary{cursor:pointer;padding:10px 14px;font:600 17px var(--serif);color:var(--ink)}
.edge{padding:10px 16px 12px;border-top:1px solid var(--line);background:var(--surface)}
.edge b{font:600 15.5px var(--serif)}
.edge p{margin:4px 0;font-size:14.5px}
.edge .where{color:var(--muted)}
.edge .code{margin:8px 0}
footer{margin-top:60px;color:var(--muted);font-size:14px}

/* play walkthrough */
.code-h .hb{display:flex;gap:6px}
.code-h .pl{border-color:#4FD1BC;color:#4FD1BC}
.code.walking pre:not(.walkview){display:none}
.walkview .wl{padding:0 8px;white-space:pre;border-left:3px solid transparent;font:13px/1.6 var(--mono);color:var(--code-ink)}
.walkview .wl.seen{background:rgba(79,209,188,.10);border-left-color:rgba(79,209,188,.45)}
.walkview .wl.cur{background:#4a3a12;border-left-color:#F2B84B}
.walkview .wl.dim{opacity:.6}
.player{background:var(--surface);border-top:1px solid var(--code-line);padding:10px 12px;color:var(--ink);outline:none}
.pl-ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pl-ctl button,.pl-ctl select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;font-size:13.5px}
.pl-ctl button:hover{border-color:var(--accent)}
.pl-ctl .pri{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .pl-ctl .pri{color:#06201B}
.pl-n{font:12.5px var(--mono);color:var(--muted);margin-left:auto}
.pl-crumb{font:12.5px var(--mono);color:var(--accent);margin-top:8px;min-height:18px}
.pl-text{margin-top:4px;font-size:15px;min-height:24px}
.pl-what{margin-top:4px;font-size:13.5px;color:var(--muted)}
.pl-what code,.pl-text code{color:var(--accent);background:var(--surface2);padding:0 4px;border-radius:4px}

/* interview */
.btn.hot{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .btn.hot{color:#06201B}
.iq{margin:18px 0 4px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-soft);overflow:hidden}
.iq>summary{cursor:pointer;padding:10px 14px;font:600 17px var(--serif)}
.iqi{border-top:1px solid var(--line);background:var(--surface);padding:0 16px}
.iqi>summary{cursor:pointer;padding:10px 0;font-weight:500;font-size:15px}
.iqi p{margin:0 0 10px;font-size:14.5px}
.iqi .trap{color:var(--amber);background:var(--amber-soft);padding:7px 10px;border-radius:8px}
.iv{position:fixed;inset:0;z-index:40;background:rgba(8,14,11,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.iv[hidden]{display:none}
.iv-box{background:var(--bg);border:1px solid var(--line);border-radius:14px;width:min(760px,100%);max-height:100%;overflow:auto;padding:18px 20px;outline:none}
.iv-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.iv-h h2{margin:0}
.iv-h .sp{flex:1}
.iv-h label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.iv-h select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px}
.iv-p{margin:12px 0 8px;font:13px var(--mono);color:var(--muted)}
.iv-bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-bottom:14px}
.iv-bar i{display:block;height:100%;background:var(--accent)}
.iv-card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.iv-card .tag{font:12.5px var(--mono);color:var(--accent)}
.iv-card h3{font:600 21px/1.3 var(--serif);margin:6px 0 12px}
.iv-ans{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.iv-ans p{margin:0 0 10px;font-size:15px}
.iv-ans .trap{color:var(--amber);background:var(--amber-soft);padding:8px 11px;border-radius:8px;font-size:14.5px}
.iv-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

@media (max-width:700px){.bar{flex-wrap:wrap}}

  nav.open{display:block}

}
</style>

<div class="bar">
  <button class="btn" id="menuBtn" aria-label="Open contents">Contents</button>
  <b>Java OOP as one system</b>
  <span class="sp"></span>
  <button class="btn hot" id="ivBtn" aria-label="Open interview practice mode">Interview mode</button>
  <button class="btn ghost" id="edgeBtn" aria-label="Collapse or expand all edge case sections">Collapse edge cases</button>
  <button class="btn ghost" id="themeBtn" aria-label="Switch colour theme">Theme</button>
</div>
<div class="shell">
  <nav id="nav" aria-label="Contents"></nav>
  <main id="main"></main>

<script>
/* ============ helpers ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const KW = 'abstract|assert|boolean|break|byte|case|catch|char|class|continue|default|do|double|else|enum|extends|final|finally|float|for|if|implements|import|instanceof|int|interface|long|new|package|private|protected|public|return|short|static|super|switch|synchronized|this|throw|throws|try|var|void|volatile|while|record|null|true|false';
const RX = new RegExp(
  /(\/\*[\s\S]*?\*\/|\/\/[^\n]*)|("""[\s\S]*?"""|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])+')|(@\w+)|\b(KWS)\b|\b(\d[\d_]*(?:\.\d+)?[dDfFlL]?)\b|\b([A-Z][A-Za-z0-9_]*)\b/.source.replace('KWS', KW), 'g');
function hl(src) {
  return esc(src).replace(RX, (m, c, s, a, k, n, t) =>
    c ? '<span class="c">' + m + '</span>' :
    s ? '<span class="s">' + m + '</span>' :
    a ? '<span class="a">' + m + '</span>' :
    k ? '<span class="k">' + m + '</span>' :
    n ? '<span class="n">' + m + '</span>' :
    t ? '<span class="t">' + m + '</span>' : m);
}
const msg = (el, text, kind) => { el.className = 'msg ' + (kind || ''); el.textContent = text; };

/* ============ content ============ */
const OVERVIEW_ROWS = [
  ['1', 'Introduction to OOP and Java', 'CO1', 'Classes, objects, constructors, static, access control', 'Every domain model: entities, DTOs, value objects'],
  ['2', 'Inheritance, packages, interfaces', 'CO2', 'Reuse and substitution, module boundaries, contracts', 'Frameworks (Spring beans, JDBC, collections) are interface-driven'],
  ['3', 'Exceptions and multithreading', 'CO3', 'Failure handling, shared state, coordination', 'Every server: request threads, retries, shutdown'],
  ['4', 'I/O, generics, strings', 'CO4', 'Persistence, type-safe containers, text processing', 'Logs, CSV/JSON import, repositories, report generation'],
  ['5', 'JavaFX events, controls, layouts', 'CO5', 'Event-driven UI wiring all of the above', 'Desktop tools; the event model is the same idea as DOM events']
];

const UNITS = [
{
  id: 'u1', n: 1, title: 'Introduction to OOP and Java', hours: 9, co: 'CO1',
  adds: 'Student', files: 'model/Student.java',
  blurb: 'Build the first real class: state, constructors, a shared counter, and controlled access.',
  topics: [
  {
    id: 't1-oop', title: 'OOP paradigms and the four pillars', syll: 'Overview of OOP, paradigms, features of OOP',
    why: 'Procedural code passes raw data to functions, so any function can corrupt any data. OOP binds data and the code allowed to touch it into one unit, which keeps change local.',
    where: 'Every layer of a business system: entities (Student), services (EnrollmentService), UI components. Frameworks assume you think in objects.',
    when: 'Use it when state and behaviour change together (a student and their marks). Use plain functions or records when you only transform data.',
    ucms: 'Previews the whole UCMS in 25 lines. Each pillar returns in a later topic with the real classes.',
    code: [{ f: 'Pillars.java', s: String.raw`// All four pillars in one file. Each is expanded later in the course.
interface Gradable { double average(); }                  // ABSTRACTION: what, not how

abstract class Person {                                   // INHERITANCE: shared base
    private String name;                                  // ENCAPSULATION: state hidden...
    Person(String name) { setName(name); }
    public String getName() { return name; }
    public final void setName(String name) {              // ...access guarded by a method
        if (name == null || name.isBlank())
            throw new IllegalArgumentException("name required");
        this.name = name.trim();
    }
    public abstract String role();                        // POLYMORPHISM hook
}

class Student extends Person implements Gradable {
    Student(String n) { super(n); }
    public String role() { return "Student"; }
    public double average() { return 82.5; }
}
class Faculty extends Person {
    Faculty(String n) { super(n); }
    public String role() { return "Faculty"; }
}

public class Pillars {
    public static void main(String[] args) {
        Person[] people = { new Student("Asha"), new Faculty("Dr. Rao") };
        for (Person p : people)

    code: [{ f: 'model/Student.java (Unit 1 version)', s: String.raw`package com.ucms.model;

/**
 * A student enrolled at the university.
 * <p>Registration numbers are generated as REG1, REG2, ...</p>
 *
 * @author Neo-Sprite
 * @version 1.0
 */
public class Student {
    private static int count = 0;                  // ONE copy shared by all Students
    private final String regNo;                    // final: assigned once, in a constructor
    private String name;
    private final int[] marks = new int[5];

    /** Auto-generates a registration number. */
    public Student(String name) {
        this(name, "REG" + (++count));             // constructor chaining; ++count runs once
    }

    /**
     * @param name  display name
     * @param regNo unique registration number
     */
    public Student(String name, String regNo) {
        this.name = name;                          // 'this' separates field from parameter
        this.regNo = regNo;
    }

    /** Sets one mark after validating the range. */
    public void setMark(int index, int value) {
        if (value < 0 || value > 100)
            throw new IllegalArgumentException("mark must be 0..100, got " + value);
        marks[index] = value;
    }

    /** @return average of all marks, 0 if none entered */
    public double average() {
        int total = 0;
        for (int m : marks) total += m;
        return (double) total / marks.length;
    }

    public String getName()  { return name; }
    public String getRegNo() { return regNo; }
    public static int getCount() { return count; } // static method: call as Student.getCount()

    @Override public String toString() { return regNo + " " + name; }
}` }],

    id: 't2-overload', title: 'Overloading, objects as parameters, returning objects', syll: 'Overloading methods, objects as parameters, returning objects',
    why: 'Overloading lets one verb accept different inputs. Java passes <i>the reference by value</i>: the callee can mutate your object but cannot re-point your variable.',
    where: 'Service APIs (<code>enroll(student, course)</code> and an <code>audit</code> variant), constructors, utility methods like <code>String.valueOf</code>.',
    when: 'Overload when the operation is the same concept. If the behaviour differs meaningfully, use a different name. Return <code>Optional</code> instead of null for "might not exist".',
    ucms: '<b>EnrollmentService</b> gets its first methods and shows how a <code>Student</code> object travels through them.',
    code: [{ f: 'service/EnrollmentService.java', s: String.raw`package com.ucms.service;

import com.ucms.model.Course;
import com.ucms.model.Student;
import java.util.List;
import java.util.Optional;

public class EnrollmentService {

    // Overloading: same name, different parameter lists. Resolved at COMPILE time.
    public boolean enroll(Student s, Course c) {
        return enroll(s, c, false);
    }

    public boolean enroll(Student s, Course c, boolean audit) {
        c.addStudent(s);        // callee mutates the SAME object the caller holds
        s = null;               // only this local copy of the reference is cleared
        return true;
    }

    public boolean enroll(Student s, Course... courses) {      // varargs: tried last
        boolean all = true;
        for (Course c : courses) all &= enroll(s, c);          // enroll(s, c) picks the 2-arg version
        return all;
    }

    // Returning objects: prefer Optional over returning null
    public Optional<Course> find(List<Course> catalog, String code) {
        for (Course c : catalog)
            if (c.getCode().equals(code)) return Optional.of(c);
        return Optional.empty();
    }
}` }],
    note: '<ul><li>Resolution order: exact match, then widening (<code>int</code> to <code>long</code>), then boxing, then varargs.</li><li>Overloading differs only by return type is illegal. Parameter lists must differ.</li></ul>'
  },

import java.util.LinkedList;
import java.util.Queue;

public class RequestQueue {
    private final Queue<String> q = new LinkedList<>();
    private final int max = 5;                               // bounded: back-pressure on producers

    public synchronized void put(String request) throws InterruptedException {
        while (q.size() == max) wait();                      // 'while', never 'if' (spurious wakeups)
        q.add(request);
        notifyAll();                                         // wake consumers waiting on empty
    }

    public synchronized String take() throws InterruptedException {
        while (q.isEmpty()) wait();                          // releases the lock while waiting
        String r = q.remove();
        notifyAll();                                         // wake producers waiting on full
        return r;
    }
}

    code: [{ f: 'service/BatchWorker.java', s: String.raw`public class BatchWorker implements Runnable {
    private volatile boolean running = true;         // volatile: other threads see the change at once
    private boolean paused = false;
    private final Object pauseLock = new Object();

    public void pause()  { synchronized (pauseLock) { paused = true; } }
    public void resume() { synchronized (pauseLock) { paused = false; pauseLock.notifyAll(); } }
    public void stop()   { running = false; resume(); }          // wake it if it is paused

    @Override public void run() {
        while (running) {
            synchronized (pauseLock) {
                while (paused && running) {
                    try { pauseLock.wait(); }
                    catch (InterruptedException e) { Thread.currentThread().interrupt(); return; }
                }
            }
            processNextRequest();                    // the actual work, outside the lock
        }
    }
}` },

    { f: 'repo/StudentFileStore.java', s: String.raw`package com.ucms.repo;

import com.ucms.model.Student;
import java.io.*;
import java.nio.charset.StandardCharsets;
import java.nio.file.*;
import java.util.*;

public class StudentFileStore {
    private final Path file;
    public StudentFileStore(Path file) { this.file = file; }

    public void save(List<Student> students) throws IOException {
        Files.createDirectories(file.getParent());
        try (BufferedWriter w = Files.newBufferedWriter(file, StandardCharsets.UTF_8)) {   // auto-closed
            for (Student s : students) {
                w.write(s.getRegNo() + "," + s.getName());
                w.newLine();
            }
        }
    }

    public List<Student> load() throws IOException {
        List<Student> out = new ArrayList<>();
        if (!Files.exists(file)) return out;
        try (BufferedReader r = Files.newBufferedReader(file, StandardCharsets.UTF_8)) {
            String line;
            while ((line = r.readLine()) != null) {
                String[] p = line.split(",", 2);                     // limit 2: name may contain commas
                if (p.length == 2) out.add(new Student(p[1].trim(), p[0].trim()));
            }
        }
        return out;
    }
}

import com.ucms.model.Person;

// Generic class with a BOUNDED type parameter: T must be a Person (or a subclass)
public class Repository<T extends Person> {
    private final Map<String, T> store = new LinkedHashMap<>();

    public void save(String id, T item)   { store.put(id, item); }

        for (T t : store.values()) sb.append(t.describe()).append('\n');   // allowed because of the bound

    why: 'This one class is where the five units meet. Reading it end to end is the quickest way to see why each topic exists.',
    where: 'The same wiring (UI handler, service call, exception to message, background save) shows up in any desktop or web client.',

    ucms: '<b>UcmsApp</b> uses: constructor and static counter (U1), Person polymorphism (U2), synchronized enroll and CourseFullException and a worker thread (U3), generic Repository, file store and String formatting (U4), and the JavaFX layout, events and menu (U5).',
    code: [{ f: 'ui/UcmsApp.java', s: String.raw`package com.ucms.ui;

import com.ucms.model.*;
import com.ucms.repo.*;
import com.ucms.service.CourseFullException;
import java.io.IOException;
import java.nio.file.Path;
import java.util.*;
import javafx.application.Application;
import javafx.application.Platform;
import javafx.collections.FXCollections;
import javafx.geometry.Insets;
import javafx.scene.Scene;
import javafx.scene.control.*;
import javafx.scene.input.KeyCombination;
import javafx.scene.layout.*;
import javafx.stage.Stage;

public class UcmsApp extends Application {

    @FunctionalInterface interface IoAction { void run() throws IOException; }          // U2: functional interface

    private final Repository<Student> students = new Repository<>();                    // U4: generics
    private final StudentFileStore store = new StudentFileStore(Path.of("data", "students.csv"));   // U4: I/O
    private final Label status = new Label("Ready");

    @Override public void start(Stage stage) {
        Course oop = new Course.Builder().code("U24CS303").title("Object Oriented Programming")
                                         .capacity(3).build();                           // U2: static nested Builder
        ListView<Course> courseList = new ListView<>(FXCollections.observableArrayList(oop));
        TextField nameField = new TextField();
        nameField.setPromptText("Student name");
        Button enrollBtn = new Button("Enroll");

        enrollBtn.setOnAction(e -> {                                                     // U5: events
            Course c = courseList.getSelectionModel().getSelectedItem();
            if (c == null || nameField.getText().isBlank()) {
                status.setText("Pick a course and enter a name");
                return;
            }
            Student s = new Student(nameField.getText().trim());                         // U1: constructor, static counter
            try {
                c.enroll(s);                                                             // U3: synchronized + checked exception
                students.save(s.getRegNo(), s);
                status.setText(s.describe() + " enrolled in " + c.getCode());            // U2: polymorphic describe()
                nameField.clear();
            } catch (CourseFullException ex) {
                new Alert(Alert.AlertType.WARNING, ex.getMessage()).showAndWait();       // exception to user message
            }
        });

        MenuItem save = new MenuItem("Save students");
        save.setAccelerator(KeyCombination.keyCombination("Ctrl+S"));
        save.setOnAction(e -> runInBackground(() -> store.save(students.all()), "Saved"));
        MenuItem exit = new MenuItem("Exit");
        exit.setOnAction(e -> Platform.exit());
        Menu file = new Menu("_File");
        file.getItems().addAll(save, new SeparatorMenuItem(), exit);

        GridPane form = new GridPane();                                                  // U5: layouts
        form.setHgap(10); form.setVgap(8); form.setPadding(new Insets(12));
        form.add(new Label("Name"), 0, 0);
        form.add(nameField, 1, 0);
        form.add(enrollBtn, 1, 1);

        BorderPane root = new BorderPane();
        root.setTop(new MenuBar(file));
        root.setLeft(courseList);
        root.setCenter(form);
        root.setBottom(status);
        BorderPane.setMargin(status, new Insets(6, 12, 6, 12));

        stage.setScene(new Scene(root, 720, 360));
        stage.setTitle("University Course Management System");
        stage.show();
    }

    // U3 + U4 + U5: do file I/O off the UI thread, update the UI back on it
    private void runInBackground(IoAction action, String okMessage) {
        Thread t = new Thread(() -> {
            try {
                action.run();
                Platform.runLater(() -> status.setText(okMessage));
            } catch (IOException ex) {
                Platform.runLater(() -> status.setText("Failed: " + ex.getMessage()));
            }
        }, "io-worker");
        t.setDaemon(true);
        t.start();
    }

    public static void main(String[] args) { launch(args); }
}` },

function edgeHTML(id) {
  const e = EDGES[id];
  if (!e) return '';
  return '<details class="edges" open><summary>Edge cases and where they bite (' + e.length + ')</summary>' +
    e.map(x => '<div class="edge"><b>' + x.t + '</b><p>' + x.d + '</p>' +
      (x.c ? '<div class="code"><pre><code>' + hl(x.c) + '</code></pre></div>' : '') +
      '<p class="where"><i>Where it bites:</i> ' + x.w + '</p></div>').join('') + '</details>';
}

const IQ = {
't1-oop': [
 [`Explain the four pillars of OOP using a real example, not definitions.`, `In UCMS: <b>encapsulation</b> is <code>Person.name</code> being private and changed only through a validated <code>setName</code>. <b>Abstraction</b> is <code>Gradable</code>: callers ask for <code>average()</code> and never see how it is computed. <b>Inheritance</b> is <code>Student extends Person</code>, reusing name handling. <b>Polymorphism</b> is <code>p.role()</code> running Student's or Faculty's version depending on the real object.`, `Is Java 100% object-oriented? No. Primitives (<code>int</code>, <code>boolean</code>) are not objects and <code>static</code> members belong to no object.`],
 [`Inheritance or composition: how do you choose?`, `Use inheritance only for a true is-a relationship where the child can stand in anywhere the parent is used (Liskov substitution). Use composition (has-a) for reuse otherwise. Composition is looser coupled and can be swapped at runtime. A <code>Course</code> has a roster; it is not a list.`, `What is the fragile base class problem? A change inside the parent silently breaks subclasses that depended on its internals, which is why parents meant for extension must document and limit what is overridable (or be <code>final</code>).`]
],
't1-java': [
 [`Why is Java called platform independent? Is the JVM platform independent?`, `<code>javac</code> compiles source to bytecode (.class). Each OS has its own JVM that executes that same bytecode. The bytecode is portable; the JVM is not, there is one build per OS and CPU.`, `JDK vs JRE vs JVM? JVM runs bytecode, JRE = JVM + core libraries, JDK = JRE + compiler and tools. Since Java 11 there is no separate JRE download; use the JDK or a jlink image.`],
 [`What does the JIT compiler do, and why do benchmarks need warm-up?`, `The JVM starts by interpreting bytecode, profiles which methods are hot, and compiles those to optimised native code at runtime. The first runs are therefore slower than later runs.`, `Why can a Java program get faster the longer it runs? Profile-guided optimisations such as inlining and escape analysis are only applied once enough data is collected. Short CLI tools pay the cost without the payoff.`]
],
't1-types': [
 [`<code>byte b = 10; b = b + 1;</code> does not compile, but <code>b += 1;</code> does. Why?`, `Arithmetic on <code>byte</code>, <code>short</code> and <code>char</code> promotes operands to <code>int</code>, so <code>b + 1</code> is an <code>int</code> and cannot be assigned to a byte without a cast. A compound assignment includes an implicit narrowing cast.`, `What does <code>Integer.MAX_VALUE + 1</code> give? <code>-2147483648</code>. Overflow wraps silently; use <code>Math.addExact</code> to throw instead.`],
 [`Are arrays objects? What are the default values?`, `Yes: they live on the heap, have a <code>length</code> field (not a method), and are created with defaults: <code>0</code>, <code>false</code>, <code>'\\u0000'</code> for primitives and <code>null</code> for references. <code>new int[3]</code> is {0,0,0}; <code>new Integer[3]</code> is {null,null,null}.`, `Can you assign <code>String[]</code> to <code>Object[]</code>? Yes (arrays are covariant), but storing an Integer into it then throws <code>ArrayStoreException</code> at runtime. Generics fix this at compile time.`]
],
't1-ops': [
 [`What is the value of <code>int i = 5; i = i++ + ++i;</code>?`, `12. <code>i++</code> yields 5 and makes i 6; <code>++i</code> makes i 7 and yields 7; 5 + 7 = 12, and the final assignment overwrites the incremented i.`, `And <code>i = i++;</code>? i stays unchanged: the old value is saved, i increments, then the old value is assigned back.`],
 [`How do old <code>switch</code> and modern switch expressions differ?`, `Old switch falls through to the next case unless you <code>break</code>. The arrow form (Java 14) never falls through, can return a value (<code>yield</code>), and for expressions the compiler demands exhaustiveness.`, `What happens if the selector is a null String? <code>NullPointerException</code>; switch on strings uses hashCode then equals, and null has neither.`]
],
't1-class': [
 [`What are the rules for constructors, and what happens if you write none?`, `Same name as the class, no return type, run on <code>new</code>. If you declare none, the compiler adds a no-argument default one. The moment you declare any constructor, that free default disappears. <code>this(...)</code> or <code>super(...)</code> must be the first statement.`, `Why make a constructor private? Singletons, utility classes with only static methods, and classes created through static factory methods like <code>List.of</code>.`],
 [`Static vs instance members: what differs, and what can static code not do?`, `Static members belong to the class and exist once; instance members belong to each object. A static method has no <code>this</code>, so it cannot touch instance fields directly. In UCMS, <code>Student.count</code> is shared by all students.`, `Can you override a static method? No, you hide it; the version used is chosen by the declared type, not the object. Calling a static through a null reference even works, and is a code smell.`]
],
't2-overload': [
 [`Overloading vs overriding: when is each resolved?`, `Overloading (same name, different parameters) is chosen at <b>compile time</b> from the declared types of the arguments. Overriding (same signature in a subclass) is chosen at <b>run time</b> from the actual object.`, `Given <code>print(Object)</code> and <code>print(String)</code>, what does <code>print(null)</code> call? The most specific, <code>print(String)</code>. But <code>Object o = "x"; print(o)</code> calls <code>print(Object)</code>.`],
 [`Is Java pass by value or pass by reference?`, `Always pass by value. For objects the value copied is the reference, so a method can change the object's state, but reassigning the parameter does not change the caller's variable.`, `Why does a <code>swap(a, b)</code> method on two Student references not work? It swaps its own copies of the references; the caller's variables still point where they did.`]
],
't2-nested': [
 [`Name the four kinds of nested classes and one use for each.`, `Static nested (a helper like <code>Builder</code>), inner (needs an instance of the outer, e.g. an iterator), local (a class inside a method), anonymous (one-off implementation, mostly replaced by lambdas).`, `Which one can cause a memory leak? Inner classes: each holds a hidden reference to the outer instance, so a long-lived inner object keeps the outer alive. A static nested class does not.`],
 [`Why must a variable captured by a lambda or inner class be effectively final?`, `The captured value is copied into the lambda. If the original could change, there would be two diverging versions and, across threads, a visibility problem. Java forbids it instead.`, `How do you get a mutable counter in a lambda? Capture a reference to a mutable holder, such as <code>AtomicInteger</code>; the reference itself stays final.`]
],
't2-inherit': [
 [`Fields are not polymorphic but methods are. What does that mean?`, `For <code>Parent p = new Child();</code>, <code>p.method()</code> runs the Child's override (dynamic dispatch), but <code>p.field</code> reads the Parent's field, chosen by the declared type. Fields are hidden, never overridden.`, `What goes wrong if a constructor calls an overridable method? The Child override can run before the Child's own fields are initialised and see zeros or nulls. Call only private or final methods in constructors.`],
 [`Abstract class or interface? Why no multiple inheritance of classes?`, `Use an interface for a capability or contract (a class can implement many); use an abstract class for shared state and partial behaviour in one family. Classes cannot inherit from two parents because of the diamond problem: which copy of the state or method wins?`, `Interfaces can now have default methods, so how is the diamond avoided? If two interfaces provide the same default, the class must override and may pick one with <code>A.super.m()</code>.`]
],
't2-packages': [
 [`List Java access modifiers from most to least open and who sees what.`, `<code>public</code>: everyone. <code>protected</code>: same package plus subclasses. Default (no keyword): same package only. <code>private</code>: same class only.`, `Can a subclass in another package call a protected method on a parent-typed reference? No. It can only access it through its own type (or a subtype), not on an arbitrary parent reference.`],
 [`What does <code>import</code> actually do?`, `Only lets you use the short name at compile time. It does not load, run or copy anything; classes load when first used.`, `What if you import <code>java.util.*</code> and <code>java.sql.*</code> and use <code>Date</code>? The compiler reports it as ambiguous; import the one you need explicitly or write the full name.`]
],
't2-interfaces': [
 [`Why were default methods added to interfaces in Java 8?`, `To add methods to an existing interface (like <code>List.sort</code>, <code>Iterable.forEach</code>) without breaking every class that already implements it.`, `Interface fields? Implicitly <code>public static final</code>: constants only, never instance state.`],
 [`What is a functional interface?`, `An interface with exactly one abstract method, usable as a lambda or method reference. <code>@FunctionalInterface</code> makes the compiler enforce that. <code>Runnable</code>, <code>Comparator</code> and <code>Gradable</code> qualify.`, `Is a marker interface (like <code>Serializable</code>) functional? No. It has no methods; it tags a type so other code can check <code>instanceof</code>.`]
],
't3-exc': [
 [`Checked vs unchecked exceptions: when do you create each?`, `Checked (extends <code>Exception</code>) must be caught or declared, for recoverable conditions the caller can reasonably handle. Unchecked (extends <code>RuntimeException</code>) signal programming errors or conditions where forcing every caller to handle it adds noise. Errors (<code>OutOfMemoryError</code>) are not meant to be caught.`, `Catch blocks: <code>catch (Exception e)</code> before <code>catch (IOException e)</code>? Compile error: the second is unreachable. Order catches from most specific to most general.`],
 [`What does <code>finally</code> do when the try block has <code>return</code>?`, `finally still runs before the method returns. A <code>return</code> inside finally replaces the original return value (and swallows exceptions), so never return from finally.`, `When does finally not run? <code>System.exit()</code>, a JVM crash, or the thread being killed. Also prefer try-with-resources, which closes resources and keeps the primary exception, recording the close failure as suppressed.`]
],
't3-thread': [
 [`<code>start()</code> vs <code>run()</code>: what is the difference?`, `<code>start()</code> asks the JVM to create a new thread, which then calls <code>run()</code>. Calling <code>run()</code> directly is an ordinary method call on the current thread, so nothing happens in parallel.`, `What if you call <code>start()</code> twice? <code>IllegalThreadStateException</code>; a thread can only be started once.`],
 [`Name the thread states and what moves a thread between them.`, `NEW, RUNNABLE (running or ready), BLOCKED (waiting for a monitor lock), WAITING (<code>wait()</code>, <code>join()</code>), TIMED_WAITING (<code>sleep(ms)</code>), TERMINATED.`, `Does a higher priority guarantee earlier execution? No: priority is only a hint to the OS scheduler. Never use it for correctness.`]
],
't3-sync': [
 [`What is a race condition, and what does <code>synchronized</code> guarantee?`, `A race is when the result depends on the timing of threads touching shared state (check-then-act on <code>Course.enrolled</code>). <code>synchronized</code> gives <b>mutual exclusion</b> (atomicity of the block) and <b>visibility</b> (changes are seen by the next thread that takes the lock).`, `Which lock does a <code>static synchronized</code> method use? The <code>Class</code> object, different from the instance lock, so the two do not exclude each other.`],
 [`<code>volatile</code> vs <code>synchronized</code>: is <code>volatile int count; count++;</code> thread-safe?`, `No. volatile gives visibility and ordering but not atomicity; <code>count++</code> is read, add, write. Use <code>synchronized</code> or <code>AtomicInteger</code>.`, `How do you create and avoid a deadlock? Two threads each hold one lock and wait for the other's. Always acquire locks in a consistent global order, or use timeouts with <code>tryLock</code>.`],
 [`Why is <code>wait()</code> always called in a loop inside synchronized?`, `<code>wait()</code> must hold the monitor (else <code>IllegalMonitorStateException</code>), it releases it while waiting, and a thread can wake spuriously or after the condition was consumed by another thread, so re-check the condition: <code>while (!ready) wait();</code>.`, `<code>notify()</code> vs <code>notifyAll()</code>? notify wakes one arbitrary waiter and can strand the right one; prefer notifyAll unless all waiters are interchangeable.`]
],
't3-control': [
 [`Why are <code>Thread.stop()</code>, <code>suspend()</code> and <code>resume()</code> deprecated?`, `<code>stop()</code> kills a thread mid-update and releases its locks, leaving objects half-modified. <code>suspend()</code> freezes a thread while it still holds locks, a deadlock waiting to happen. Cooperative cancellation replaces them.`, `How do you stop a thread properly? Call <code>interrupt()</code> and have the loop check <code>isInterrupted()</code> (or catch <code>InterruptedException</code>) and exit cleanly.`],
 [`What do you use today instead of managing raw threads?`, `An <code>ExecutorService</code> thread pool, <code>CompletableFuture</code> for pipelines, and on Java 21 virtual threads (<code>Executors.newVirtualThreadPerTaskExecutor()</code>) for blocking-style code at scale.`, `Catching <code>InterruptedException</code> and doing nothing is a bug. Why? It clears the interrupt flag; restore it with <code>Thread.currentThread().interrupt()</code> or rethrow.`]
],
't4-io': [
 [`Byte streams vs character streams, and why wrap with a buffer?`, `Byte streams (<code>InputStream</code>/<code>OutputStream</code>) move raw bytes; character streams (<code>Reader</code>/<code>Writer</code>) decode bytes to text using a charset. A <code>Buffered</code> wrapper cuts the number of costly system calls.`, `Why specify a charset explicitly? Older default charsets depend on the OS, so the same file reads differently on different machines (UTF-8 is the default since Java 18).`],
 [`How do you make sure a file is always closed?`, `try-with-resources: any <code>AutoCloseable</code> declared in the parentheses is closed in reverse order even if an exception occurs, replacing verbose try/finally.`, `Why does <code>nextInt()</code> followed by <code>nextLine()</code> on Scanner return an empty string? nextInt leaves the newline in the buffer, so nextLine consumes it immediately; call an extra nextLine to clear it.`]
],
't4-generics': [
 [`What is type erasure, and what limits does it cause?`, `The compiler checks generic types, then removes them; at run time <code>List&lt;String&gt;</code> is just <code>List</code>. So you cannot do <code>new T()</code>, <code>new T[n]</code>, or <code>obj instanceof List&lt;String&gt;</code>, and primitives cannot be type arguments.`, `Is <code>List&lt;Object&gt;</code> a supertype of <code>List&lt;String&gt;</code>? No, generics are invariant. Use <code>List&lt;? extends Object&gt;</code> to accept both.`],
 [`Explain PECS (Producer Extends, Consumer Super).`, `If a structure only <b>produces</b> items you read, use <code>? extends T</code>. If it only <b>consumes</b> items you write, use <code>? super T</code>. UCMS's <code>averageOf(List&lt;? extends Gradable&gt;)</code> only reads.`, `Why can you not <code>add</code> to a <code>List&lt;? extends Number&gt;</code>? The real element type could be Integer or Double; the compiler cannot prove your item fits, so it forbids every add except null.`]
],
't4-coll': [
 [`How does <code>HashMap</code> work internally?`, `<code>hashCode()</code> picks a bucket; within it, <code>equals()</code> finds the key. Default load factor 0.75 triggers a resize, and a bucket with many collisions becomes a balanced tree (Java 8+) to stay O(log n).`, `What breaks if you mutate a key after inserting it? Its hash changes, so lookups go to the wrong bucket and the entry becomes unreachable. Use immutable keys and always override equals and hashCode together.`],
 [`Why do you get <code>ConcurrentModificationException</code> and how do you remove while iterating?`, `Iterators are fail-fast: a structural change outside the iterator bumps a modCount the iterator checks. Use <code>iterator.remove()</code>, <code>removeIf</code>, or iterate over a copy.`, `ArrayList vs LinkedList? ArrayList: O(1) index access, appends amortised O(1). LinkedList: O(1) at ends but O(n) to find an index and worse cache behaviour; ArrayList wins in most real code.`]
],
't4-strings': [
 [`Why is <code>String</code> immutable, and how many objects does <code>new String("hi")</code> create?`, `Immutability makes strings safe as map keys, thread-safe, and allows the string pool to share them. <code>new String("hi")</code> creates a new heap object, plus the pooled literal <code>"hi"</code> if not already present: one or two.`, `<code>"a" + "b" == "ab"</code>? true, compile-time constants are folded and pooled. With a non-final variable it is false, which is why you use <code>equals</code>.`],
 [`String, StringBuilder, StringBuffer: when do you use which?`, `String for fixed text. StringBuilder for building text in a loop (not synchronised, fastest). StringBuffer is the synchronised legacy version, rarely needed since one thread usually builds the string.`, `Why is <code>s += x</code> in a loop slow? Each pass creates a new String and copies everything so far: O(n squared) work. Append to one StringBuilder instead.`]
],
't5-events': [
 [`Explain the JavaFX event model: source, event, handler, filter.`, `A control (source) fires an <code>Event</code>; a handler registered with <code>setOnAction</code> or <code>addEventHandler</code> reacts. The event travels down the scene graph (capturing, where filters run) then back up (bubbling, where handlers run). <code>consume()</code> stops it.`, `Why does the window freeze if a handler runs a slow query? Handlers run on the single JavaFX Application Thread that also paints the UI; blocking it blocks everything.`],
 [`How do you do background work and still update the UI safely?`, `Run it in a <code>Task</code> or an executor, then touch controls only on the FX thread via <code>Platform.runLater</code> or the Task's <code>succeeded</code> handler.`, `What happens if you update a control from another thread? Unpredictable: usually an <code>IllegalStateException: Not on FX application thread</code>.`]
],
't5-controls': [
 [`Binding vs listener in JavaFX: when to use each?`, `<code>bind</code> keeps one property permanently equal to an expression (a label's text to a slider's value). A listener runs code when a value changes, for side effects. Bind for derived state, listen for actions.`, `After <code>bind</code>, what happens if you call <code>set</code> on the bound property? A <code>RuntimeException</code>; a one-way bound property is read-only until unbound (use <code>bindBidirectional</code> for two-way).`],
 [`How does a <code>ListView</code> or <code>TableView</code> stay updated automatically?`, `Back it with an <code>ObservableList</code>: adding or removing items fires change events the control listens to, so you edit the data, not the control.`, `Should you validate in the UI only? No. The UI is a convenience; enforce rules in the model or service too (like <code>Student.setName</code>), because the UI is only one caller.`]
],
't5-layouts': [
 [`Which layout pane for which job?`, `<code>HBox</code>/<code>VBox</code>: a row or column. <code>BorderPane</code>: app shell (menu top, nav left, content centre). <code>GridPane</code>: forms. <code>StackPane</code>: overlays. <code>FlowPane</code>: wrapping items.`, `Why use layout panes and not absolute coordinates? They recompute on resize, font and DPI changes; absolute positions break on other screens.`],
 [`How do you make one child grow when the window grows?`, `Set <code>HBox.setHgrow(node, Priority.ALWAYS)</code> (or the VBox/GridPane equivalent), and allow the node to expand via <code>setMaxWidth(Double.MAX_VALUE)</code>.`, `What is the difference between <code>Group</code> and <code>Pane</code>? Pane is a resizable container; a Group is not resized by its parent and just applies effects and transforms to its children.`]
],
't5-menus': [
 [`Describe a JavaFX menu structure, and how you avoid duplicating logic between a menu item and a toolbar button.`, `<code>MenuBar</code> contains <code>Menu</code> objects, which contain <code>MenuItem</code>s with accelerators. Point the menu item and the toolbar button at the same handler method (or the same action object) so the logic lives once.`, `Where do context menus come from? <code>ContextMenu</code> attached to a node, shown on right click or the platform's menu key.`],
 [`How do you disable Save when nothing changed?`, `Bind the menu item's <code>disableProperty</code> to a boolean property such as <code>dirty.not()</code>, so the UI follows the state automatically instead of being toggled by hand.`, `Why is hand-toggling enabled state error-prone? Each code path that changes state must remember to update every control; one missed path leaves the UI lying.`]
],
't5-app': [
 [`Walk through the lifecycle of a JavaFX application.`, `<code>main</code> calls <code>Application.launch</code>; the FX runtime constructs your class, calls <code>init()</code> (off the UI thread), then <code>start(Stage)</code> on the FX thread where you build the scene, and <code>stop()</code> on exit for cleanup.`, `Why does a JavaFX app fail to start on a plain classpath after Java 11? JavaFX is no longer bundled; you need the OpenJFX modules (<code>javafx.controls</code>) on the module path.`],
 [`The enrol button can be double-clicked and two threads call <code>enroll()</code> on the last seat. How do you fix it end to end?`, `Disable the button while the request runs (UI guard), run the call off the FX thread, and make <code>Course.enroll</code> atomic with <code>synchronized</code> or a database constraint. The server-side guard is the one that really protects the data.`, `Which of the two guards is the real one? The server/model guard: UI guards can be bypassed by a second client or a retry.`]
]
};
const IQ_FLAT = [];
Object.keys(IQ).forEach(id => IQ[id].forEach((x, i) => IQ_FLAT.push({ id, unit: +id[1], q: x[0], a: x[1], f: x[2], key: id + '-' + i })));
function iqHTML(id) {
  const l = IQ[id];

}

function describeLine(c) {

  }

  if ((m = c.match(/^throw\s+new\s+(\w+)/))) return 'Throws <code>' + esc(m[1]) + '</code>: this method stops here and the JVM unwinds the call stack to the nearest matching catch.';
  if (/^throw\b/.test(c)) return 'Rethrows an exception: execution leaves this method immediately.';
  if (/^try\b/.test(c)) return /^try\s*\(/.test(c) ? 'try-with-resources: the resource is closed automatically when the block ends, even on exception.' : 'try: if anything inside throws, control jumps to a matching catch.';
  if ((m = c.match(/^\}?\s*catch\s*\(([^)]*)\)/))) return 'catch <code>' + esc(m[1]) + '</code>: runs only if the try block threw that type. Order catches specific to general.';
  if (/^\}?\s*finally\b/.test(c)) return 'finally: runs whether the try succeeded, failed or returned.';
  if (/^(\}\s*)?else\s+if/.test(c)) return 'else if: tested only when the earlier conditions were false.';
  if (/^\}?\s*else\b/.test(c)) return 'else: runs when the condition above was false.';
  if (/^if\s*\(/.test(c)) return 'Condition: the block runs only when the expression is true.';
  if (/^for\s*\(.*:/.test(c)) return 'Enhanced for: visits each element in turn, with no index.';
  if (/^for\s*\(/.test(c)) return 'for loop: initialise, test, run the body, update, repeat.';
  if (/^while\s*\(/.test(c)) return 'while: repeats the body as long as the condition is true.';
  if (/^switch\b/.test(c)) return 'switch: jumps to the matching case. Without <code>break</code> (old form) control falls through.';
  if (/^(case|default)\b/.test(c)) return 'Case label: a possible match for the switch value.';
  if (/^return\b/.test(c)) return 'return: leaves the method and hands the value (if any) back to the caller.';
  if (/^(break|continue)\b/.test(c)) return c.startsWith('break') ? 'break: leaves the nearest loop or switch.' : 'continue: skips to the next loop iteration.';

  if (/^(super|this)\s*\(/.test(c)) return c.startsWith('super') ? 'Calls the parent constructor. It must be the first statement.' : 'Calls another constructor of this class (constructor chaining).';
  if (/System\.(out|err)\.print/.test(c)) return 'Prints to the console.';
  if (/\.start\(\)/.test(c)) return 'start(): the JVM creates a new thread that calls <code>run()</code>. Execution of this thread continues immediately.';
  if (/\.join\(/.test(c)) return 'join(): this thread waits until the other thread finishes.';
  if (/\.(wait|notify|notifyAll)\(/.test(c)) return 'Monitor coordination: only legal while holding the lock of the object.';
  if ((m = c.match(/^([\w<>\[\],.? ]+?)\s+(\w+)\s*=\s*new\s+([\w.]+)/))) return 'Creates a <code>' + esc(m[3]) + '</code> object on the heap and stores its reference in <code>' + esc(m[2]) + '</code> (on the stack).';
  if ((m = c.match(/^((?:(?:public|private|protected|static|final|volatile|transient)\s+)+)[\w<>\[\],.? ]+\s+(\w+)\s*(=.*)?;$/))) {

  }
  if ((m = c.match(/^(int|long|short|byte|char|boolean|float|double)(\[\])?\s+(\w+)/))) return 'Local variable <code>' + esc(m[3]) + '</code> of primitive type <code>' + m[1] + (m[2] || '') + '</code>' + (m[2] ? ' (an array object on the heap).' : ': the value itself lives on the stack frame.');

  if (/^[\w<>\[\],.? ]+\s+\w+\s*;$/.test(c)) return 'Declares a variable with no value yet; reading it before assignment is a compile error.';
  if (/"""\s*$/.test(c)) return 'Text block: a multi-line string literal.';
  return '';

    if (inBlock) {
      const cm = t.replace(/\*\/.*$/, '').replace(/^\*+\s?/, '').trim();
      if (/\*\//.test(t)) inBlock = false;
      if (cm) pend.push(cm);
      out.push({ i, step: false, dim: true }); return;
    }
    if (t.startsWith('/*')) {
      inBlock = !/\*\//.test(t);
      const cm = t.replace(/^\/\*+\s?/, '').replace(/\*\/.*$/, '').trim();
      if (cm) pend.push(cm);
      out.push({ i, step: false, dim: true }); return;
    }
    const m = mask(t), k = m.indexOf('//');
    const code = (k >= 0 ? m.slice(0, k) : m).trim(), cm = k >= 0 ? t.slice(k + 2).trim() : '';
    if (!code) {
      if (cm) pend.push(cm); else if (!t) pend = [];
      out.push({ i, step: false, dim: !!cm }); return;
    }
    const lead = ((code.match(/^[}\s]*/)[0]).match(/\}/g) || []).length;
    for (let n = 0; n < lead; n++) stack.pop();
    const rest = code.replace(/^[}\s]*/, '');
    if (!rest || /^[\]);,\s]*$/.test(rest)) { out.push({ i, step: false }); return; }
    if (/^@\w+(\(.*\))?$/.test(rest)) { ann = rest; out.push({ i, step: false }); return; }
    const crumb = stack.filter(Boolean).join(' \u203A ');
    const oneLiner = /^[^=]*\)\s*(?:throws [\w., ]+)?\s*\{[^{}]*\}\s*;?$/.test(rest);
    let what = describeLine(oneLiner ? rest.replace(/\{[^{}]*\}\s*;?$/, '{') : code);
    if (/^@Override/.test(ann)) { what = '@Override: the compiler checks this really overrides a parent method. ' + what; }
    ann = '';
    let label = '', d;
    if ((d = rest.match(/\b(?:class|interface|enum|record)\s+(\w+)/)) && !/^(new|return)\b/.test(rest)) label = d[1];
    else if (/^(if|for|while|switch|try|catch|else|do|finally|synchronized)\b/.test(rest) || /^\}?\s*(else|catch|finally)/.test(code)) label = (rest.match(/^(\w+)/) || [''])[1];
    else if ((d = rest.match(/(\w+)\s*\([^)]*\)\s*(?:throws [\w., ]+)?\s*\{$/))) label = d[1] + '()';
    const opens = (rest.match(/\{/g) || []).length, closes = (rest.match(/\}/g) || []).length;
    for (let n = 0; n < opens; n++) stack.push(n === 0 ? label : '');
    for (let n = 0; n < closes; n++) stack.pop();
    out.push({ i, step: true, crumb, text: cm || pend.join(' '), what });
    pend = [];
  });
  return out;
}
function closeWalk(box) {
  if (box._stop) box._stop();
  box.classList.remove('walking');
  $$('.walkview,.player', box).forEach(n => n.remove());
  const b = $('.pl', box); if (b) b.innerHTML = '&#9654; Play';
}
function openWalk(box) {
  if (box.classList.contains('walking')) { closeWalk(box); return; }
  const src = $('pre code', box).textContent, lines = src.split('\n');
  const info = analyseCode(src), steps = info.filter(x => x.step);
  const view = document.createElement('pre'); view.className = 'walkview';
  view.innerHTML = lines.map((l, i) => '<div class="wl' + (info[i] && info[i].dim ? ' dim' : '') + '" data-i="' + i + '">' + (hl(l) || '&nbsp;') + '</div>').join('');
  const pl = document.createElement('div'); pl.className = 'player'; pl.tabIndex = 0;
  pl.setAttribute('role', 'group'); pl.setAttribute('aria-label', 'Code walkthrough controls');
  pl.innerHTML = '<div class="pl-ctl"><button data-p="reset">Restart</button><button data-p="prev">Back</button><button data-p="play" class="pri">Play</button><button data-p="next">Next</button>' +
    '<select data-p="speed" aria-label="Playback speed"><option value="2000">Slow</option><option value="1200" selected>Normal</option><option value="600">Fast</option></select>' +
    '<button data-p="close">Close</button><span class="pl-n"></span></div><div class="pl-crumb"></div><div class="pl-text" aria-live="polite"></div><div class="pl-what"></div>';
  box.appendChild(view); box.appendChild(pl); box.classList.add('walking');
  $('.pl', box).innerHTML = '&#9632; Stop';
  let pos = -1, timer = null;
  const play = $('[data-p=play]', pl), speed = $('[data-p=speed]', pl);
  const stop = () => { if (timer) { clearInterval(timer); timer = null; } play.textContent = 'Play'; };
  box._stop = stop;
  const show = () => {
    $$('.wl', view).forEach(e => e.classList.remove('cur', 'seen'));
    steps.forEach((s, n) => { if (n < pos) view.children[s.i].classList.add('seen'); });
    const cr = $('.pl-crumb', pl), tx = $('.pl-text', pl), wh = $('.pl-what', pl);
    $('.pl-n', pl).textContent = pos < 0 ? steps.length + ' steps' : 'Step ' + (pos + 1) + ' / ' + steps.length;
    if (pos < 0) { cr.textContent = ''; tx.textContent = 'Press Next or Play. Each step highlights one line and says what it does and why.'; wh.textContent = ''; return; }
    const s = steps[pos], el = view.children[s.i];
    el.classList.add('cur');
    try { el.scrollIntoView({ block: 'nearest' }); } catch (e) { /* older browsers */ }
    cr.textContent = s.crumb ? 'In: ' + s.crumb : 'Top level of the file';
    if (s.text) { tx.textContent = s.text; wh.innerHTML = s.what; }
    else { tx.innerHTML = s.what || 'Executes this statement.'; wh.textContent = ''; }
    if (pos === steps.length - 1) wh.innerHTML += (wh.innerHTML ? ' ' : '') + '<b>End of walkthrough.</b> Now close it and predict the output before you run it yourself.';
  };
  const next = () => { if (pos < steps.length - 1) { pos++; show(); } else stop(); };
  const go = () => {
    if (pos >= steps.length - 1) pos = -1;
    stop(); play.textContent = 'Pause'; next();
    timer = setInterval(() => { if (pos >= steps.length - 1) stop(); else next(); }, +speed.value);
  };
  pl.addEventListener('click', e => {
    const p = e.target.dataset && e.target.dataset.p;
    if (!p || p === 'speed') return;
    if (p === 'close') closeWalk(box);
    else if (p === 'reset') { stop(); pos = -1; show(); }
    else if (p === 'prev') { stop(); if (pos > -1) pos--; show(); }
    else if (p === 'next') { stop(); next(); }
    else if (p === 'play') { if (timer) stop(); else go(); }
  });
  speed.addEventListener('change', () => { if (timer) go(); });
  pl.addEventListener('keydown', e => {
    if (e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); stop(); next(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); stop(); if (pos > -1) pos--; show(); }
    else if (e.key === ' ' && e.target === pl) { e.preventDefault(); if (timer) stop(); else go(); }
  });
  show(); pl.focus();
}
$('#main').addEventListener('click', e => {
  const b = e.target.closest('.pl');
  if (b) openWalk(b.closest('.code'));
});

/* ============ Interview mode: flashcard drill ============ */
(function () {
  const topicTitle = {};
  UNITS.forEach(u => u.topics.forEach(t => { topicTitle[t.id] = t.title; }));
  const ov = document.createElement('div');
  ov.className = 'iv'; ov.id = 'iv'; ov.hidden = true;
  ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-labelledby', 'ivT');
  ov.innerHTML = '<div class="iv-box" tabindex="-1"><div class="iv-h"><h2 id="ivT">Interview drill</h2><span class="sp"></span>' +
    '<label>Unit <select id="ivU"><option value="0">All units</option>' + UNITS.map(u => '<option value="' + u.n + '">Unit ' + u.n + '</option>').join('') + '</select></label>' +
    '<label><input type="checkbox" id="ivS" checked> Shuffle</label><button class="btn" id="ivX">Close (Esc)</button></div>' +
    '<div class="iv-p" id="ivP"></div><div class="iv-bar"><i id="ivB" style="width:0"></i></div><div id="ivC" aria-live="polite"></div></div>';
  document.body.appendChild(ov);
  const box = $('.iv-box', ov), C = $('#ivC', ov);
  let deck = [], pos = 0, shown = false, got = 0, miss = [], opener = null;
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  function start(list) {
    deck = list.slice(); if ($('#ivS', ov).checked) shuffle(deck);
    pos = 0; shown = false; got = 0; miss = []; render();
  }
  function startUnit() {
    const u = +$('#ivU', ov).value;
    start(IQ_FLAT.filter(x => !u || x.unit === u));
  }
  function render() {
    const total = deck.length;
    $('#ivP', ov).textContent = pos < total ? 'Question ' + (pos + 1) + ' of ' + total + '  |  confident ' + got + '  |  to review ' + miss.length : 'Finished';
    $('#ivB', ov).style.width = (total ? Math.round(pos / total * 100) : 0) + '%';
    if (pos >= total) {
      const pct = total ? Math.round(got / total * 100) : 0;
      C.innerHTML = '<div class="iv-card"><h3>' + got + ' of ' + total + ' answered confidently (' + pct + '%)</h3><p>' +
        (pct >= 80 ? 'Strong. Rehearse the follow-up traps out loud; interviewers probe those.' : pct >= 50 ? 'Decent base. Retry the missed ones, then open each topic and use Play on its code.' : 'Go back through the topics with Play first, then retry. Understanding beats memorising here.') + '</p>' +
        '<div class="iv-act">' + (miss.length ? '<button class="pri" data-d="retry">Retry missed (' + miss.length + ')</button>' : '') + '<button data-d="again">Restart</button></div></div>';
      const f = $('button', C); if (f) f.focus(); return;
    }
    const x = deck[pos];
    C.innerHTML = '<div class="iv-card"><div class="tag">Unit ' + x.unit + ' | ' + esc(topicTitle[x.id] || '') + '</div><h3>' + x.q + '</h3>' +
      (shown ? '<div class="iv-ans"><p>' + x.a + '</p><p class="trap"><b>Follow-up they ask:</b> ' + x.f + '</p><p><a href="#' + x.id + '" data-d="open">Open this topic</a></p>' +
        '<div class="iv-act"><button class="pri" data-d="got">I would nail this</button><button class="bad" data-d="miss">Review again</button></div></div>'
      : '<p>Answer out loud in 30 seconds first. Then reveal and compare.</p><div class="iv-act"><button class="pri" data-d="reveal">Reveal model answer</button></div>') + '</div>';
    const f = $('button', C); if (f) f.focus();
  }
  function open() { opener = document.activeElement; ov.hidden = false; startUnit(); box.focus(); document.body.style.overflow = 'hidden'; }
  function close() { ov.hidden = true; document.body.style.overflow = ''; if (opener && opener.focus) opener.focus(); }
  C.addEventListener('click', e => {
    const d = e.target.dataset && e.target.dataset.d;
    if (!d) return;
    if (d === 'reveal') { shown = true; render(); }
    else if (d === 'got') { got++; pos++; shown = false; render(); }
    else if (d === 'miss') { miss.push(deck[pos]); pos++; shown = false; render(); }
    else if (d === 'retry') start(miss);
    else if (d === 'again') startUnit();
    else if (d === 'open') close();
  });
  $('#ivU', ov).onchange = startUnit;
  $('#ivS', ov).onchange = startUnit;
  $('#ivX', ov).onclick = close;
  ov.addEventListener('click', e => { if (e.target === ov) close(); });
  document.addEventListener('keydown', e => {
    if (ov.hidden) return;
    if (e.key === 'Escape') close();
    if (e.key === 'Tab') {
      const f = $$('button,select,input,a[href]', ov).filter(n => !n.disabled && n.offsetParent !== null);
      if (!f.length) return;
      const a = f[0], z = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === a || document.activeElement === box)) { e.preventDefault(); z.focus(); }
      else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
    }
  });
  $('#ivBtn').onclick = open;
})();

/* ============ page assembly ============ */
function codeBlock(c) {
  return '<div class="code"><div class="code-h"><span>' + esc(c.f) + '</span><span class="hb"><button class="pl" aria-label="Play step-by-step walkthrough of ' + esc(c.f) + '">&#9654; Play</button><button class="cp" aria-label="Copy ' + esc(c.f) + '">Copy</button></span></div><pre><code>' + hl(c.s) + '</code></pre></div>';
}
function topicHTML(t) {
  return '<article class="topic" id="' + t.id + '"><header><h3 class="t">' + t.title + '</h3><span class="syll">Syllabus: ' + esc(t.syll) + '</span></header>' +
    '<div class="wwh"><div><b>Why</b>' + t.why + '</div><div><b>Where</b>' + t.where + '</div><div><b>When</b>' + t.when + '</div></div>' +
    '<div class="ucms"><b>In UCMS.</b> ' + t.ucms + '</div>' +
    t.code.map(codeBlock).join('') +
    (t.note ? '<div class="note">' + t.note + '</div>' : '') +
    (t.viz ? '<div class="viz" id="viz-' + t.viz + '"></div>' : '') + edgeHTML(t.id) + iqHTML(t.id) + '</article>';
}

function build() {
  const main = $('#main');
  let h = '<h1>Java OOP, built as one system</h1>' +
    '<p class="lead">Your syllabus (U24CS303, 3 credits, 45 hours) ends with one goal: a University Course Management System. This page teaches every topic through that single project, including the edge cases that cause real bugs, so each unit adds a layer to code you already have.</p>' +
    '<h2>How the five units stack</h2><div class="map">' +
    UNITS.map(u => '<a href="#' + u.id + '"><b>Unit ' + u.n + '</b><small>' + esc(u.blurb) + '</small><small><code>' + esc(u.files) + '</code></small></a>').join('') + '</div>' +
    '<p class="note">Each layer depends only on the ones before it: the UI calls services, services use the model, the model uses nothing above it. That one-way dependency is what makes it testable.</p>' +
    '<h2 style="margin-top:34px">Syllabus analysis</h2><div class="tw"><table><tr><th>Unit</th><th>Title</th><th>Hours</th><th>Outcome</th><th>What you learn to do</th><th>Where it shows up at work</th></tr>' +
    UNITS.map((u, i) => '<tr><td>' + u.n + '</td><td>' + esc(OVERVIEW_ROWS[i][1]) + '</td><td>' + u.hours + '</td><td>' + u.co + '</td><td>' + esc(OVERVIEW_ROWS[i][3]) + '</td><td>' + esc(OVERVIEW_ROWS[i][4]) + '</td></tr>').join('') +
    '</table></div>' +
    '<div class="note"><ul><li><b>Weight:</b> 5 units x 9 hours = 45 hours, so each unit is 20% of the course. Units 3 and 4 hold the most production-critical material (concurrency, I/O, generics).</li><li><b>CO-PO mapping:</b> the course averages 3 (strong) on PSO1 and 2 on most other programme outcomes. PO3 (design) and PO12 (lifelong learning) are the strongest general links, and CO3 is strongest on PO1/PO2.</li><li><b>Gaps worth filling for working developers:</b> CO4 names Collections but Unit 4 does not list them (covered here), try-with-resources, <code>Optional</code>, records and sealed types (Java 16 and 17), streams, virtual threads (Java 21), and JavaFX being a separate module since Java 11. Each appears where it fits.</li></ul></div>' +
    '<h2 style="margin-top:34px">How to use this page</h2><div class="note"><ul><li>Each topic card answers <b>why</b>, <b>where</b> and <b>when</b>, then shows the code, then (for 8 topics) an interactive visualizer you can poke, then the edge cases: what breaks, and where in real systems it bites.</li><li><b>Play</b>: press the Play button on any code block to walk it line by line, with each line explained. <b>Interview mode</b> (top bar) drills 47 questions with model answers and the follow-ups interviewers use; every topic also ends with an Interview corner.</li><li>Code is cumulative: when a class reappears, it is the same class growing. Files are named so you can paste them into a real project (layout in Unit 2).</li><li>Target: Java 21 LTS. The syllabus-era features work on Java 8+; newer syntax is labelled with the version it needs.</li></ul></div>';
  UNITS.forEach(u => {
    h += '<section class="unit" id="' + u.id + '"><div class="unit-h"><h2>Unit ' + u.n + ': ' + u.title + '</h2><span class="chip acc">' + u.co + '</span><span class="chip">' + u.hours + ' hours</span></div>' +
      '<p class="lead" style="font-size:16px">' + esc(u.blurb) + '</p>' + u.topics.map(topicHTML).join('') + '</section>';
  });
  h += '<footer>Course data from the Meenakshi Sundararajan Engineering College R2024 CSE syllabus, U24CS303. Code targets Java 21; JavaFX 21 SDK.</footer>';
  main.innerHTML = h;

  $('#nav').innerHTML = '<h3>Overview</h3><a href="#main">Syllabus analysis</a>' +
    UNITS.map(u => '<h3>Unit ' + u.n + '</h3>' + u.topics.map(t => '<a href="#' + t.id + '">' + esc(t.title.length > 46 ? t.title.slice(0, 44) + '...' : t.title) + '</a>').join('')).join('');

  $$('.viz', main).forEach(v => { const k = v.id.replace('viz-', ''); if (VIZ[k]) VIZ[k](v); });

  main.addEventListener('click', e => {
    const b = e.target.closest('.cp');
    if (!b) return;
    const text = b.closest('.code').querySelector('code').textContent;
    const done = () => { b.textContent = 'Copied'; setTimeout(() => { b.textContent = 'Copy'; }, 1400); };
    try {
      navigator.clipboard.writeText(text).then(done, () => fallbackCopy(text, done));
    } catch (err) { fallbackCopy(text, done); }
  });
}
function fallbackCopy(text, done) {
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); done();
  } catch (e) { /* clipboard unavailable: leave button text unchanged */ }
}

/* nav highlight, menu and theme */
function wireChrome() {
  const links = $$('#nav a');
  const map = new Map(links.map(a => [a.getAttribute('href').slice(1), a]));
  const io = new IntersectionObserver(es => {
    es.forEach(e => {
      if (e.isIntersecting && map.has(e.target.id)) {
        links.forEach(l => l.classList.remove('on'));
        map.get(e.target.id).classList.add('on');
      }
    });
  }, { rootMargin: '-20% 0px -70% 0px' });
  $$('.topic').forEach(t => io.observe(t));
  $('#menuBtn').onclick = () => $('#nav').classList.toggle('open');
  $('#nav').addEventListener('click', e => { if (e.target.tagName === 'A') $('#nav').classList.remove('open'); });
  $('#themeBtn').onclick = () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
  };
}
build();
wireChrome();
(function () {
  const btn = $('#edgeBtn');
  let open = true;
  btn.onclick = () => {
    open = !open;
    $$('details.edges').forEach(d => { d.open = open; });
    btn.textContent = open ? 'Collapse edge cases' : 'Expand edge cases';
  };
})();
